<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wonder Deck K-9</title>
<meta name="description" content="Nine keys. Each press opens a miniature world that bursts into life for a few seconds, then gently fades away.">
<meta name="theme-color" content="#d9d5cd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap">
<style>
/* Layout: full-bleed 3D room. Brand plate top-left, meters top-right, story plaque bottom-centre. */
:root{
  --room:#d9d5cd; --shell:#dcd8d0; --hi:#f8f6f1; --lo:#aaa396; --ink:#2e2a25; --dim:#5f574d;
  --amber:#e8842c; --rust:#b4502a; --brown:#6e4429; --teal:#23968f;
  --glass:#0b0f11; --vfd:#86f5df; --vfd-dim:#5aa196;
  --display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --seg:"VT323","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--room:#1c1e21;--shell:#26282c;--hi:#33363b;--lo:#111214;--ink:#ebe5da;--dim:#958e83;color-scheme:dark}}
:root[data-theme="dark"]{--room:#1c1e21;--shell:#26282c;--hi:#33363b;--lo:#111214;--ink:#ebe5da;--dim:#958e83;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--room);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(0,0,0,.28) 100%)}
.tilt{position:fixed;left:0;right:0;pointer-events:none;z-index:1;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.tilt.top{top:0;height:13vh;-webkit-mask-image:linear-gradient(#000 10%,transparent);mask-image:linear-gradient(#000 10%,transparent)}
.tilt.bottom{bottom:0;height:11vh;-webkit-mask-image:linear-gradient(transparent,#000 90%);mask-image:linear-gradient(transparent,#000 90%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;mix-blend-mode:screen}
.hud{position:fixed;z-index:5;display:flex;gap:12px;align-items:center}
.plate{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));background:var(--shell);border-radius:18px;padding:10px 16px 10px 12px;box-shadow:8px 8px 20px rgba(0,0,0,.18),-6px -6px 16px rgba(255,255,255,.12)}
.stripes{display:flex;flex-direction:column;gap:3px;width:38px;flex:none}
.stripes i{display:block;height:5px;border-radius:3px}
.stripes i:nth-child(1){background:var(--brown)}.stripes i:nth-child(2){background:var(--rust)}.stripes i:nth-child(3){background:var(--amber)}
.plate h1{margin:0;font-size:clamp(16px,2vw,21px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.plate p{margin:4px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.meters{top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}
.vfd{background:var(--glass);border-radius:10px;padding:6px 12px 4px;font-family:var(--seg);font-size:22px;line-height:1;color:var(--vfd);text-shadow:0 0 6px rgba(134,245,223,.55);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.vfd small{font-size:15px;color:var(--vfd-dim);text-shadow:none;margin-right:6px}
.switch{display:flex;align-items:center;gap:10px;background:var(--shell);color:var(--ink);border:0;border-radius:14px;padding:8px 12px;box-shadow:6px 6px 14px rgba(0,0,0,.18),-5px -5px 12px rgba(255,255,255,.12);cursor:pointer;font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.switch .track{width:34px;height:18px;border-radius:9px;background:var(--glass);position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);transition:transform .2s}
.switch[aria-pressed="false"] .track::after{transform:translateX(16px);background:var(--dim);box-shadow:none}
.switch:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.plaque{left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);flex-direction:column;align-items:center;gap:6px;text-align:center;width:min(560px,calc(100vw - 32px));padding:14px 22px 16px;border-radius:20px;background:color-mix(in srgb,var(--shell) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:10px 10px 26px rgba(0,0,0,.2),-6px -6px 18px rgba(255,255,255,.1);opacity:0;transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none}
.plaque.show{opacity:1;transform:translateX(-50%) translateY(0)}
.plaque .era{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.plaque h2{margin:0;font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:.02em;line-height:1.05;text-wrap:balance}
.plaque p{margin:0;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--ink);opacity:.85;max-width:52ch;text-wrap:pretty}
#readout{min-width:12ch;text-align:center}
body.fx .tilt,body.fx .vignette{display:none}
@media (max-width:640px){.plate p{display:none}#readout{display:none}.vfd small{display:none}.switch span:last-child{display:none}}
@media (prefers-reduced-motion: reduce){.plaque{transition:opacity .4s}.switch .track::after{transition:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Wonder Deck: nine keys, each opens a miniature world. Press any key on your keyboard or click a pad."></canvas>
<div class="vignette"></div>
<div class="tilt top"></div><div class="tilt bottom"></div>
<div id="flash"></div>
<header class="hud plate">
  <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
  <div><h1>Wonder Deck K-9</h1><p>Miniature worlds · one press at a time</p></div>
</header>
<div class="hud meters">
  <div class="vfd" id="readout" aria-live="polite">PRESS WORLD</div>
  <div class="vfd"><small>WORLDS</small><span id="count">0000</span></div>
  <button class="switch" id="mute" aria-pressed="true"><span class="track"></span><span id="muteLbl">Sound on</span></button>
</div>
<div class="hud plaque show" id="plaque" aria-live="polite">
  <span class="era" id="era">Standby</span>
  <h2 id="title">Press WORLD</h2>
  <p id="line">The centre key opens a world. The eight around it shape it: time, clouds, rain, wind, glow, life, a replay of its big moment, and a 90° spin. Keys 1–9 or the letter on each key work too.</p>
</div>
<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="app.js"></script>
</body>
</html>
